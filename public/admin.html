<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin — Mía</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b141a; color: #e9edef;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .header {
      background: #202c33; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #2a3942; flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .back-btn { background: none; border: none; color: #00a884; font-size: 22px; cursor: pointer; padding: 0 4px; display: none; }
    .header-title { font-size: 17px; font-weight: 600; }
    .header-sub { font-size: 12px; color: #8696a0; margin-top: 1px; }
    .live-badge { background: #00a884; color: white; font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; flex-shrink: 0; }
    .main { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 320px; flex-shrink: 0; border-right: 1px solid #2a3942; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 12px 16px; background: #202c33; border-bottom: 1px solid #2a3942; font-size: 13px; color: #8696a0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .patient-list { overflow-y: auto; flex: 1; }
    .patient-list::-webkit-scrollbar { width: 4px; }
    .patient-list::-webkit-scrollbar-thumb { background: #2a3942; border-radius: 2px; }
    .patient-item { padding: 14px 16px; border-bottom: 1px solid #1a2530; cursor: pointer; transition: background 0.15s; display: flex; align-items: center; gap: 12px; }
    .patient-item:hover { background: #182229; }
    .patient-item.active { background: #2a3942; }
    .patient-avatar { width: 44px; height: 44px; border-radius: 50%; background: #2a3942; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; position: relative; }
    .modo-badge { position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #0b141a; }
    .modo-badge.bot { background: #00a884; }
    .modo-badge.humano { background: #f59e0b; }
    .patient-info { flex: 1; min-width: 0; }
    .patient-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .patient-preview { font-size: 12px; color: #8696a0; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .patient-meta { text-align: right; flex-shrink: 0; }
    .patient-time { font-size: 11px; color: #8696a0; }
    .patient-msgs { font-size: 11px; color: #8696a0; margin-top: 2px; }
    .pausado-tag { background: #f59e0b; color: #0b141a; font-size: 10px; padding: 2px 6px; border-radius: 8px; margin-top: 3px; display: inline-block; font-weight: 600; }
    .convo-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .convo-header { background: #202c33; padding: 12px 16px; border-bottom: 1px solid #2a3942; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .convo-avatar { width: 40px; height: 40px; border-radius: 50%; background: #2a3942; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .convo-name { font-size: 15px; font-weight: 600; }
    .convo-detail { font-size: 11px; color: #8696a0; margin-top: 1px; }
    .convo-actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
    .btn { padding: 6px 12px; border-radius: 8px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; }
    .btn:hover { opacity: 0.85; }
    .btn-pause  { background: #f59e0b; color: #0b141a; }
    .btn-resume { background: #00a884; color: white; }
    .btn-clear  { background: #2a3942; color: #e9edef; }
    .btn-wa     { background: #25d366; color: white; }
    .btn-link   { background: #3b82f6; color: white; }

    .messages-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .messages-area::-webkit-scrollbar { width: 4px; }
    .messages-area::-webkit-scrollbar-thumb { background: #2a3942; border-radius: 2px; }
    .msg-wrap { display: flex; }
    .msg-wrap.user { justify-content: flex-end; }
    .msg-wrap.assistant { justify-content: flex-start; }
    .msg-bubble { max-width: 70%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.45; word-break: break-word; }
    .msg-wrap.user .msg-bubble { background: #005c4b; border-top-right-radius: 2px; }
    .msg-wrap.assistant .msg-bubble { background: #202c33; border-top-left-radius: 2px; }
    .msg-time { font-size: 10px; color: #8696a0; margin-top: 3px; text-align: right; }
    .date-sep { text-align: center; margin: 8px 0; }
    .date-sep span { background: #182229; color: #8696a0; font-size: 11px; padding: 3px 10px; border-radius: 6px; }
    .patient-data-bar { background: #182229; border-top: 1px solid #2a3942; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 16px; flex-shrink: 0; font-size: 12px; color: #8696a0; }
    .patient-data-bar span { color: #e9edef; }
    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8696a0; gap: 12px; }
    .empty-icon { font-size: 48px; }
    .empty-text { font-size: 15px; }
    .no-patients { padding: 32px 16px; text-align: center; color: #8696a0; font-size: 14px; }

    /* ── Modal generar link ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #202c33; border-radius: 12px;
      padding: 24px; width: 340px; max-width: 90vw;
      display: flex; flex-direction: column; gap: 16px;
    }
    .modal-title { font-size: 16px; font-weight: 600; color: #e9edef; }
    .modal-field { display: flex; flex-direction: column; gap: 6px; }
    .modal-label { font-size: 12px; color: #8696a0; }
    .modal-input {
      background: #2a3942; border: 1px solid #3a4952;
      border-radius: 8px; padding: 10px 12px;
      color: #e9edef; font-size: 14px; outline: none;
      width: 100%;
    }
    .modal-input:focus { border-color: #00a884; }
    .modal-row { display: flex; gap: 10px; }
    .modal-row .modal-field { flex: 1; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .btn-cancel { background: #2a3942; color: #8696a0; }
    .btn-generate { background: #00a884; color: white; }

    /* resultado del link */
    .link-result {
      background: #182229; border-radius: 8px;
      padding: 12px; font-size: 12px; color: #8696a0;
      word-break: break-all; display: none;
    }
    .link-result.show { display: block; }
    .link-result a { color: #00a884; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #2a3942; color: #e9edef; font-size: 13px;
      padding: 10px 20px; border-radius: 20px;
      opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; }

    /* Botón flotante "Nuevo turno" */
    .fab {
      position: fixed; bottom: 24px; right: 24px;
      background: #00a884; color: white;
      border: none; border-radius: 50px;
      padding: 14px 20px; font-size: 14px; font-weight: 600;
      cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      display: flex; align-items: center; gap: 8px;
      z-index: 50;
    }
    .fab:hover { background: #00c99d; }

    @media (max-width: 640px) {
      .sidebar { width: 100%; position: absolute; inset: 0; top: 57px; z-index: 10; background: #0b141a; }
      .sidebar.hidden { display: none; }
      .convo-panel { position: absolute; inset: 0; top: 57px; z-index: 10; background: #0b141a; display: none; }
      .convo-panel.visible { display: flex; }
      .back-btn { display: block; }
      .btn { font-size: 11px; padding: 5px 10px; }
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <button class="back-btn" id="backBtn" onclick="goBack()">←</button>
    <div>
      <div class="header-title" id="headerTitle">Panel Admin — Mía</div>
      <div class="header-sub" id="lastUpdate">Actualizando...</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <button class="btn" style="background:#2a3942;color:#8696a0;font-size:11px;padding:5px 10px" onclick="abrirConfig()">⚙ Config</button>
    <div class="live-badge">EN VIVO</div>
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>Conversaciones</span>
      <span id="totalCount">—</span>
    </div>
    <div class="patient-list" id="patientList">
      <div class="no-patients">Cargando...</div>
    </div>
  </div>

  <div class="convo-panel" id="convoPanel">
    <div class="empty">
      <div class="empty-icon">💬</div>
      <div class="empty-text">Seleccioná una conversación</div>
    </div>
  </div>
</div>

<!-- Botón flotante -->
<button class="fab" onclick="abrirModal()">+ Nuevo turno</button>

<!-- Modal generar link -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">Generar link de turno</div>

    <div class="modal-field">
      <label class="modal-label">Nombre del paciente</label>
      <input class="modal-input" id="mNombre" type="text" placeholder="Juan Pérez" />
    </div>

    <div class="modal-field">
      <label class="modal-label">Práctica</label>
      <select class="modal-input" id="mPractica">
        <option value="Control de rutina">Control de rutina</option>
        <option value="Limpieza dental">Limpieza dental</option>
        <option value="Extracción simple">Extracción simple</option>
        <option value="Blanqueamiento">Blanqueamiento</option>
        <option value="Control de ortodoncia">Control de ortodoncia</option>
        <option value="Implante">Implante</option>
      </select>
    </div>

    <div class="modal-row">
      <div class="modal-field">
        <label class="modal-label">Fecha</label>
        <input class="modal-input" id="mFecha" type="date" />
      </div>
      <div class="modal-field">
        <label class="modal-label">Hora</label>
        <input class="modal-input" id="mHora" type="time" step="1800" />
      </div>
    </div>

    <div class="link-result" id="linkResult">
      Mensaje que recibirá Mía:<br><br>
      <strong id="linkMensaje"></strong><br><br>
      <a id="linkUrl" href="#" target="_blank">Abrir link</a>
      &nbsp;·&nbsp;
      <span style="cursor:pointer;color:#00a884" onclick="copiarLink()">Copiar link</span>
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-generate" onclick="generarLink()">Generar link</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Modal configuración -->
<div class="modal-overlay" id="configOverlay">
  <div class="modal">
    <div class="modal-title">Configuración</div>

    <div class="modal-field">
      <label class="modal-label">Número de WhatsApp del bot</label>
      <input class="modal-input" id="cfgBotNumber" type="text" placeholder="15551445115" />
      <span style="font-size:11px;color:#8696a0;margin-top:4px">Sin + ni espacios. Ej: 15551445115</span>
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="cerrarConfig()">Cancelar</button>
      <button class="btn btn-generate" onclick="guardarConfig()">Guardar</button>
    </div>
  </div>
</div>

<script>
  const API = "";

  // ── IMPORTANTE: cambiá este número por el del bot (sin + ni espacios) ──
  const BOT_NUMBER = localStorage.getItem("cfg_bot_number") || "15551445115";

  let selectedTel   = null;
  let patients      = [];
  let userScrolling = false;
  let scrollTimer   = null;

  const isMobile = () => window.innerWidth <= 640;

  function fmtTime(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  }
  function fmtDate(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" });
  }
  function escHtml(t) {
    return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  // ── Modal generar link ────────────────────
  function abrirModal() {
    // Setear fecha de hoy por defecto
    const hoy = new Date().toISOString().split("T")[0];
    document.getElementById("mFecha").value = hoy;
    document.getElementById("mHora").value = "09:30";
    document.getElementById("linkResult").classList.remove("show");
    document.getElementById("modalOverlay").classList.add("show");
    document.getElementById("mNombre").focus();
  }

  function cerrarModal() {
    document.getElementById("modalOverlay").classList.remove("show");
  }

  // Click fuera del modal lo cierra
  document.getElementById("modalOverlay").addEventListener("click", (e) => {
    if (e.target === document.getElementById("modalOverlay")) cerrarModal();
  });

  function generarLink() {
    const nombre   = document.getElementById("mNombre").value.trim();
    const practica = document.getElementById("mPractica").value;
    const fecha    = document.getElementById("mFecha").value;
    const hora     = document.getElementById("mHora").value;

    if (!nombre || !fecha || !hora) {
      showToast("Completá todos los campos");
      return;
    }

    // Formato del mensaje que Mía va a detectar
    // TURNO_DIRECTO es la palabra clave que usa el agente para reconocerlo
    const mensaje = `TURNO_DIRECTO|${nombre}|${practica}|${fecha}|${hora}`;
    const url = `https://wa.me/${BOT_NUMBER}?text=${encodeURIComponent(mensaje)}`;

    document.getElementById("linkMensaje").textContent = mensaje;
    document.getElementById("linkUrl").href = url;
    document.getElementById("linkResult").classList.add("show");
  }

  function copiarLink() {
    const url = document.getElementById("linkUrl").href;
    navigator.clipboard.writeText(url)
      .then(() => showToast("Link copiado"))
      .catch(() => {
        const el = document.createElement("textarea");
        el.value = url;
        document.body.appendChild(el);
        el.select();
        document.execCommand("copy");
        document.body.removeChild(el);
        showToast("Link copiado");
      });
  }

  // ── Navegación mobile ─────────────────────
  function goBack() {
    selectedTel = null;
    if (isMobile()) {
      document.getElementById("sidebar").classList.remove("hidden");
      document.getElementById("convoPanel").classList.remove("visible");
      document.getElementById("backBtn").style.display = "none";
      document.getElementById("headerTitle").textContent = "Panel Admin — Mía";
    }
  }

  function showConvo(patient) {
    if (isMobile()) {
      document.getElementById("sidebar").classList.add("hidden");
      document.getElementById("convoPanel").classList.add("visible");
      document.getElementById("backBtn").style.display = "block";
      document.getElementById("headerTitle").textContent = patient.nombre || patient.telefono;
    }
  }

  // ── Cargar pacientes ──────────────────────
  async function loadPatients() {
    try {
      const res = await fetch(`${API}/patients`);
      patients = await res.json();
      renderSidebar();
      if (selectedTel && !userScrolling) await updateMessages(selectedTel);
      document.getElementById("lastUpdate").textContent = `Actualizado ${fmtTime(new Date().toISOString())}`;
    } catch(e) { console.error(e); }
  }

  // ── Sidebar ───────────────────────────────
  function renderSidebar() {
    const list = document.getElementById("patientList");
    document.getElementById("totalCount").textContent =
      `${patients.length} paciente${patients.length !== 1 ? "s" : ""}`;

    if (!patients.length) {
      list.innerHTML = '<div class="no-patients">Sin conversaciones todavía</div>';
      return;
    }

    list.innerHTML = patients.map(p => `
      <div class="patient-item ${p.telefono === selectedTel ? "active" : ""}"
           onclick="selectPatient('${p.telefono}')">
        <div class="patient-avatar">
          👤
          <div class="modo-badge ${p.modo}"></div>
        </div>
        <div class="patient-info">
          <div class="patient-name">${escHtml(p.nombre)}</div>
          <div class="patient-preview">${escHtml(p.telefono)}</div>
          ${p.modo === "humano" ? '<span class="pausado-tag">Esperando intervención</span>' : ""}
        </div>
        <div class="patient-meta">
          <div class="patient-time">${fmtDate(p.updated_at)}</div>
          <div class="patient-msgs">${p.total_mensajes} msg</div>
        </div>
      </div>
    `).join("");
  }

  // ── Seleccionar paciente ──────────────────
  async function selectPatient(telefono) {
    selectedTel   = telefono;
    userScrolling = false;
    renderSidebar();
    const patient = patients.find(p => p.telefono === telefono);
    if (patient) showConvo(patient);
    await loadMessages(telefono, true);
  }

  // ── Carga completa del panel ──────────────
  async function loadMessages(telefono, scrollBottom = false) {
    const patient = patients.find(p => p.telefono === telefono);
    if (!patient) return;

    const res = await fetch(`${API}/patients/${telefono}/messages`);
    const messages = await res.json();

    const panel = document.getElementById("convoPanel");
    panel.innerHTML = `
      <div class="convo-header">
        <div class="convo-avatar">👤</div>
        <div style="flex:1;min-width:0">
          <div class="convo-name">${escHtml(patient.nombre)}</div>
          <div class="convo-detail">
            ${escHtml(patient.telefono)}
            ${patient.dni ? ` · DNI ${patient.dni}` : ""}
            ${patient.obra_social ? ` · ${patient.obra_social}` : ""}
            · <strong>${patient.modo === "humano" ? "⏸ Pausado" : "🤖 Bot activo"}</strong>
          </div>
        </div>
        <div class="convo-actions">
          ${patient.modo === "bot"
            ? `<button class="btn btn-pause" onclick="pauseConvo('${telefono}')">Pausar</button>`
            : `<button class="btn btn-resume" onclick="resumeConvo('${telefono}')">Reanudar</button>`}
          <button class="btn btn-clear" onclick="clearConvo('${telefono}')">Borrar</button>
        </div>
      </div>
      <div class="messages-area" id="messagesArea">
        ${renderMessages(messages)}
      </div>
      <div class="patient-data-bar">
        <div>Tel: <span>${patient.telefono}</span></div>
        ${patient.dni ? `<div>DNI: <span>${patient.dni}</span></div>` : ""}
        ${patient.obra_social ? `<div>OS: <span>${patient.obra_social}</span></div>` : ""}
        <div>Mensajes: <span>${patient.total_mensajes}</span></div>
        <div>Desde: <span>${fmtDate(patient.created_at)}</span></div>
      </div>
    `;

    const area = document.getElementById("messagesArea");
    if (area) {
      area.addEventListener("scroll", () => {
        userScrolling = true;
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => { userScrolling = false; }, 5000);
      });
      if (scrollBottom) area.scrollTop = area.scrollHeight;
    }
  }

  // ── Actualización liviana (polling) ───────
  async function updateMessages(telefono) {
    const area = document.getElementById("messagesArea");
    if (!area) return;

    const res = await fetch(`${API}/patients/${telefono}/messages`);
    const messages = await res.json();

    const currentCount = area.querySelectorAll(".msg-wrap").length;
    if (messages.length > currentCount) {
      const nuevos = messages.slice(currentCount);
      const fragment = document.createDocumentFragment();
      nuevos.forEach(msg => {
        const div = document.createElement("div");
        div.className = `msg-wrap ${msg.role}`;
        div.innerHTML = `
          <div class="msg-bubble">
            ${escHtml(msg.text)}
            <div class="msg-time">${fmtTime(msg.ts)}</div>
          </div>`;
        fragment.appendChild(div);
      });
      const wasAtBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 50;
      area.appendChild(fragment);
      if (wasAtBottom && !userScrolling) area.scrollTop = area.scrollHeight;
    }

    const detail = document.querySelector(".convo-detail strong");
    const patient = patients.find(p => p.telefono === telefono);
    if (detail && patient) {
      detail.textContent = patient.modo === "humano" ? "⏸ Pausado" : "🤖 Bot activo";
    }
  }

  function renderMessages(messages) {
    if (!messages.length) return '<div style="text-align:center;color:#8696a0;padding:32px">Sin mensajes</div>';
    let html = "", lastDate = null;
    messages.forEach(msg => {
      const d = msg.ts ? new Date(msg.ts).toLocaleDateString("es-AR") : null;
      if (d && d !== lastDate) {
        html += `<div class="date-sep"><span>${d}</span></div>`;
        lastDate = d;
      }
      html += `
        <div class="msg-wrap ${msg.role}">
          <div class="msg-bubble">
            ${escHtml(msg.text)}
            <div class="msg-time">${fmtTime(msg.ts)}</div>
          </div>
        </div>`;
    });
    return html;
  }

  // ── Acciones ──────────────────────────────
  async function pauseConvo(tel) {
    await fetch(`${API}/admin/pause/${tel}`, { method: "POST" });
    await loadPatients();
    await loadMessages(tel, false);
  }
  async function resumeConvo(tel) {
    await fetch(`${API}/admin/resume/${tel}`, { method: "POST" });
    await loadPatients();
    await loadMessages(tel, false);
  }
  async function clearConvo(tel) {
    if (!confirm("Borrar historial de esta conversación?")) return;
    await fetch(`${API}/session/${tel}`, { method: "DELETE" });
    await loadPatients();
    if (selectedTel === tel) await loadMessages(tel, true);
  }

  // ── Configuración ─────────────────────────
  function abrirConfig() {
    document.getElementById("cfgBotNumber").value = localStorage.getItem("cfg_bot_number") || "15551445115";
    document.getElementById("configOverlay").classList.add("show");
  }

  function cerrarConfig() {
    document.getElementById("configOverlay").classList.remove("show");
  }

  function guardarConfig() {
    const num = document.getElementById("cfgBotNumber").value.trim().replace(/\D/g, "");
    if (!num) { showToast("Ingresá un número válido"); return; }
    localStorage.setItem("cfg_bot_number", num);
    cerrarConfig();
    showToast("Configuración guardada");
  }

  document.getElementById("configOverlay").addEventListener("click", (e) => {
    if (e.target === document.getElementById("configOverlay")) cerrarConfig();
  });

  loadPatients();
  setInterval(loadPatients, 3000);
</script>
</body>
</html>
